name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p justvnc-proto --target wasm32-unknown-unknown

  i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test -p justvnc-proto --target i686-unknown-linux-gnu

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml -- -D warnings
      - run: python3 fuzz/seed_corpus.py
      - name: Fuzz each target for a minute
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" "corpus/$target" -- -max_total_time=60 -timeout=10
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start TigerVNC
        run: |
          docker build -t justvnc-tigervnc -f interop/tigervnc/Containerfile interop/tigervnc
          docker run -d --name tigervnc -e XVNC_ARGS=-retro -p 5900:5900 justvnc-tigervnc
          docker run -d --name tigervnc-auth -e VNC_PASSWORD=justvnc-secret -p 5901:5900 justvnc-tigervnc
          for port in 5900 5901; do
            for i in $(seq 30); do nc -z 127.0.0.1 $port && break; sleep 1; done
            nc -z 127.0.0.1 $port || { docker logs tigervnc; docker logs tigervnc-auth; exit 1; }
          done
      - run: cargo test -p justvnc-client --features tokio --test interop -- --ignored --test-threads=1
        env:
          JUSTVNC_TIGERVNC_ADDR: 127.0.0.1:5900
          JUSTVNC_TIGERVNC_AUTH_ADDR: 127.0.0.1:5901
          JUSTVNC_TIGERVNC_EXEC: docker exec tigervnc
