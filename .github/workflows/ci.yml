name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p justvnc-proto --target wasm32-unknown-unknown

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start TigerVNC
        run: |
          docker build -t justvnc-tigervnc -f interop/tigervnc/Containerfile interop/tigervnc
          docker run -d --name tigervnc -p 5900:5900 justvnc-tigervnc
          for i in $(seq 30); do nc -z 127.0.0.1 5900 && exit 0; sleep 1; done
          docker logs tigervnc; exit 1
      - run: cargo test -p justvnc-client --features tokio --test interop -- --ignored
        env:
          JUSTVNC_TIGERVNC_ADDR: 127.0.0.1:5900
