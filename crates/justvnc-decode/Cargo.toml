[package]
name = "justvnc-decode"
description = "Pixel decoding for RFB encodings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1.1"
justvnc-proto.workspace = true
zune-jpeg = { version = "0.5", optional = true }

[dev-dependencies]
flate2 = "1.1"

[features]
# Tight JPEG rectangles, decoded with zune-jpeg (pure Rust).
jpeg = ["dep:zune-jpeg"]
