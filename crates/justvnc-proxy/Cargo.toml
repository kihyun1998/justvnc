[package]
name = "justvnc-proxy"
description = "RFB Proxy between a Viewer and a Target"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom = "0.4.3"
justvnc-proto.workspace = true
tokio = { version = "1.54.0", default-features = false, features = ["io-util", "macros"], optional = true }

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
justvnc-client = { workspace = true, features = ["tokio"] }
justvnc-server = { workspace = true, features = ["tokio"] }
tokio = { version = "1.54.0", features = ["macros", "rt", "rt-multi-thread", "net", "time"] }

[[example]]
name = "proxy"
required-features = ["tokio"]
